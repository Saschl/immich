name: build-server
on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: saschl/immich-server
          tags: type=semver,pattern={{major}}.{{minor}}.{{patch}}
      - name: Build with docker
        run: docker build -f server/Dockerfile -t ghcr.io/saschl/immich-server:${{ steps.meta.outputs.version }} --label "org.opencontainers.image.source=`https://github.com/Saschl/immich`" --label  "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" .
      - name: login to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u Saschl --password-stdin
      - name: push to registry
        run: docker push ghcr.io/saschl/immich-server:${{ steps.meta.outputs.version }}